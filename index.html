<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Student Ridership</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --border: #e3e5e8; --text: #1d2125; --muted: #6b7280;
    --blue: #1f5eff; --blue-soft: #e8efff;
    --green: #1e7f4f; --green-soft: #dcf3e6;
    --red: #c4282d; --red-soft: #fde4e4;
    --amber: #8a5a00; --amber-soft: #fbefd0; --amber-line: #e9c46a;
    --gray-soft: #eef0f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 Inter, -apple-system, "Segoe UI", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0; }

  /* top bar + sidebar */
  .topbar { height: 56px; background: var(--card); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 16px; padding: 0 20px;
            position: sticky; top: 0; z-index: 10; }
  .brand { font-weight: 600; font-size: 15px; width: 196px; display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--text); color: #fff;
                display: grid; place-items: center; font-size: 13px; }
  .search { position: relative; flex: 1; max-width: 480px; }
  .search input { width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 8px;
                  padding: 0 12px 0 34px; font: inherit; background: var(--bg); outline: none; }
  .search input:focus { border-color: var(--blue); background: #fff; }
  .search::before { content: "⌕"; position: absolute; left: 12px; top: 7px; color: var(--muted); font-size: 16px; }
  .dropdown { position: absolute; top: 42px; left: 0; right: 0; background: #fff; border: 1px solid var(--border);
              border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.08); overflow: hidden; }
  .dropdown a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  .dropdown a:hover, .dropdown a.active { background: var(--blue-soft); }
  .dropdown .empty { padding: 12px; color: var(--muted); }
  .topbar .spacer { flex: 1; }
  .layout { display: flex; }
  .sidebar { width: 216px; padding: 16px 12px; position: sticky; top: 56px; height: calc(100vh - 56px);
             border-right: 1px solid var(--border); background: var(--card); }
  .sidebar a { display: block; padding: 8px 12px; border-radius: 6px; margin-bottom: 2px; color: var(--muted); font-weight: 500; }
  .sidebar a:hover { background: var(--gray-soft); }
  .sidebar a.active { background: var(--blue-soft); color: var(--blue); }
  main { flex: 1; padding: 24px 32px; max-width: 1100px; }

  /* building blocks */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
               border-bottom: 1px solid var(--border); }
  .card-head .hint { color: var(--muted); font-size: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
  .tile-label { color: var(--muted); font-size: 13px; }
  .tile-value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile.red .tile-label, .tile.red .tile-value { color: var(--red); }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-line); }
  .pill.gray { background: var(--gray-soft); color: var(--muted); }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }
  .btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
         font: inherit; font-weight: 500; cursor: pointer; }
  .btn:hover { background: var(--gray-soft); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { filter: brightness(.95); }
  .muted { color: var(--muted); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--gray-soft); color: var(--muted);
            display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
  .avatar.big { width: 48px; height: 48px; font-size: 16px; }
  .bus-badge { width: 40px; height: 40px; border-radius: 8px; background: var(--blue-soft); color: var(--blue);
               display: grid; place-items: center; font-weight: 600; font-size: 16px; flex: none; }
  .bus-badge.small { width: 30px; height: 30px; font-size: 13px; border-radius: 6px; }

  /* header card on bus / student pages */
  .header { display: flex; align-items: center; gap: 14px; padding: 16px; }
  .header .title { font-size: 17px; font-weight: 600; }
  .header .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .back { display: inline-block; color: var(--muted); margin-bottom: 12px; }
  .back:hover { color: var(--text); }

  /* alert banners */
  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; margin: 0 0 8px;
            background: var(--amber-soft); border: 1px solid var(--amber-line); color: var(--amber); }
  .banner.red { background: var(--red-soft); border-color: #f3b5b5; color: var(--red); }
  .banner a { text-decoration: underline; }

  /* people rows */
  .section-label { padding: 10px 16px 6px; font-size: 12px; font-weight: 600; color: var(--muted);
                   text-transform: uppercase; letter-spacing: .03em; background: #fafbfc; border-bottom: 1px solid var(--border); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  a.row:hover { background: #f8f9fb; }
  .row.flagged { background: #fdf6e3; }
  .row .main { flex: 1; min-width: 0; }
  .row .name { font-weight: 500; }
  .row .sub { color: var(--muted); font-size: 12px; }

  /* tables */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 16px;
       border-bottom: 1px solid var(--border); background: #fafbfc; }
  td { padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tr.link { cursor: pointer; }
  tr.link:hover td { background: #f8f9fb; }
  td .cell { display: flex; align-items: center; gap: 10px; }
  .num { font-variant-numeric: tabular-nums; }
  .red-text { color: var(--red); font-weight: 600; }
  .empty-state { padding: 32px; text-align: center; color: var(--muted); }
  td .cell { white-space: nowrap; }

  /* narrow windows (laptop split screen, tablet): sidebar becomes a top strip */
  @media (max-width: 900px) {
    .brand { width: auto; }
    .layout { flex-direction: column; }
    .sidebar { width: auto; height: auto; position: static; display: flex; gap: 4px;
               border-right: 0; border-bottom: 1px solid var(--border); padding: 8px 12px; }
    main { padding: 16px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .card { overflow-x: auto; }
    .header { flex-wrap: wrap; }
    .header .actions { margin-left: 0; width: 100%; flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark">▣</span>Student Ridership</div>
  <div class="search">
    <input id="search" placeholder="Search students" autocomplete="off">
    <div id="search-results" class="dropdown" hidden></div>
  </div>
  <div class="spacer"></div>
  <span id="roster-status" class="muted"></span>
  <button class="btn" onclick="refreshRoster()">Refresh roster</button>
</header>

<div class="layout">
  <nav class="sidebar">
    <a href="#" id="nav-buses">Buses</a>
    <a href="#students" id="nav-students">Students</a>
  </nav>
  <!-- Each page is drawn into #page by one of the show... functions below. -->
  <main id="page"></main>
</div>

<script>
// ------------------------------------------------------------ helpers ----

const $ = id => document.getElementById(id);

// Escape text before putting it into HTML.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function clock(t) { return new Date(t * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); }
function day(t) { return new Date(t * 1000).toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"}); }
function amPm(t) { return new Date(t * 1000).getHours() < 12 ? "AM" : "PM"; }
function initials(name) {
  return String(name).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
}
function busNumber(name) { const m = String(name).match(/\d+/); return m ? m[0] : String(name)[0]; }
async function getJSON(url) { const r = await fetch(url); return r.ok ? r.json() : null; }

// status -> [label, color]. Same names the server uses.
const STATUS = {
  aboard:      ["Aboard", "green"],
  dropped_off: ["Dropped off", "gray"],
  not_boarded: ["Not boarded yet", "gray"],
  no_show:     ["No show", "red"],
  left_on_bus: ["Never tapped off", "red"],
  wrong_bus:   ["Wrong bus", "amber"],
  rejected:    ["Rejected scan", "amber"],
};
const FLAGGED = ["left_on_bus", "wrong_bus", "rejected"];

function pill(status) {
  const [label, color] = STATUS[status];
  return `<span class="pill ${color}">${label}</span>`;
}
function routePill(route) {
  if (!route) return `<span class="pill gray">No route yet</span>`;
  if (route.ended_at !== null) return `<span class="pill gray">Route ended ${clock(route.ended_at)}</span>`;
  return `<span class="pill green">En route · since ${clock(route.started_at)}</span>`;
}
function tile(label, value, redIfAny) {
  const red = redIfAny && value > 0 ? "red" : "";
  return `<div class="tile ${red}"><div class="tile-label">${label}</div><div class="tile-value num">${value}</div></div>`;
}
function personRow(userId, name, sub, status) {
  const flagged = FLAGGED.includes(status) ? "flagged" : "";
  return `<a class="row ${flagged}" href="#student/${encodeURIComponent(userId)}">
    <div class="avatar">${esc(initials(name))}</div>
    <div class="main"><div class="name">${esc(name)}</div><div class="sub">${sub}</div></div>
    ${pill(status)}</a>`;
}

// ------------------------------------------------------- page: buses ----

async function showOverview() {
  const buses = await getJSON("/buses");
  const enRoute = buses.filter(b => b.route && b.route.ended_at === null).length;
  const total = key => buses.reduce((n, b) => n + b[key], 0);

  const rows = buses.map(b => `
    <tr class="link" onclick="location.hash='bus/${encodeURIComponent(b.door_id)}'">
      <td><div class="cell"><span class="bus-badge small">${esc(busNumber(b.name))}</span>${esc(b.name)}</div></td>
      <td>${routePill(b.route)}</td>
      <td class="num">${b.on_bus}</td>
      <td class="num">${b.roster}</td>
      <td class="num">${b.off_bus}</td>
      <td class="num ${b.not_boarded && b.route ? "red-text" : ""}">${b.not_boarded}</td>
      <td class="num ${b.flags ? "red-text" : ""}">${b.flags}</td>
    </tr>`).join("");

  $("page").innerHTML = `
    <h1>Buses</h1>
    <div class="tiles">
      ${tile("Buses en route", enRoute)}
      ${tile("Students aboard", total("on_bus"))}
      ${tile("Dropped off", total("off_bus"))}
      ${tile("Flags open", total("flags"), true)}
    </div>
    <div class="card">
      ${buses.length ? `<table>
        <thead><tr><th>Bus</th><th>Status</th><th>Aboard</th><th>On roster</th>
                   <th>Dropped off</th><th>Not boarded</th><th>Flags</th></tr></thead>
        <tbody>${rows}</tbody></table>`
      : `<div class="empty-state">No buses yet. Press Refresh roster, or tap a card on any reader.</div>`}
    </div>`;
}

// --------------------------------------------------------- page: bus ----

async function showBus(doorId) {
  const m = await getJSON(`/bus/${encodeURIComponent(doorId)}`);
  if (!m) { location.hash = ""; return; }
  const ended = m.route && m.route.ended_at !== null;

  // One list of everyone, sorted into sections.
  const attention = [], aboard = [], waiting = [], off = [];
  for (const s of m.on_bus) {
    const status = s.wrong_bus ? "wrong_bus" : ended ? "left_on_bus" : "aboard";
    const sub = `On at ${clock(s.on_at)}` + (s.wrong_bus ? " · not on this bus's roster" : "");
    (status === "aboard" ? aboard : attention).push(personRow(s.user_id, s.name, sub, status));
  }
  for (const s of m.off_bus) {
    const status = s.wrong_bus ? "wrong_bus" : "dropped_off";
    const sub = `On at ${clock(s.on_at)} · off at ${clock(s.last_tap)}`;
    (status === "wrong_bus" ? attention : off).push(personRow(s.user_id, s.name, sub, status));
  }
  for (const s of m.not_boarded) {
    const status = ended ? "no_show" : "not_boarded";
    const sub = m.route ? "Expected · no scan recorded" : "On this bus's roster";
    waiting.push(personRow(s.user_id, s.name, sub, status));
  }
  const section = (label, rows) => rows.length
    ? `<div class="section-label">${label} · ${rows.length}</div>${rows.join("")}` : "";

  // Rejected scans as banners at the top.
  const banners = m.alerts.map(a => {
    if (!a.user_id) return `<div class="banner">⚠ Unrecognized card ${esc(a.card)} scanned at ${clock(a.time)}</div>`;
    const where = a.assigned.length ? `assigned ${esc(a.assigned.join(", "))}` : "not assigned to any bus";
    return `<div class="banner">⚠ Wrong bus: <a href="#student/${encodeURIComponent(a.user_id)}">${esc(a.name)}</a>
            (${where}) scanned at ${clock(a.time)} · card rejected</div>`;
  }).join("");
  const leftOn = ended && attention.length
    ? `<div class="banner red">⚠ Route ended with students who never tapped off. Check the bus.</div>` : "";

  $("page").innerHTML = `
    <a class="back" href="#">← All buses</a>
    <div class="card"><div class="header">
      <span class="bus-badge">${esc(busNumber(m.name))}</span>
      <div><div class="title">${esc(m.name)}</div><div class="muted">${m.roster.length} students on roster</div></div>
      <div class="actions">
        ${routePill(m.route)}
        <button class="btn primary" onclick="routeAction('start')">Start route</button>
        <button class="btn" onclick="routeAction('end')">End route</button>
      </div>
    </div></div>
    <div class="tiles">
      ${tile(ended ? "Left on bus" : "Aboard now", m.on_bus.length, ended)}
      ${tile("Expected on roster", m.roster.length)}
      ${tile("Dropped off", m.off_bus.length)}
      ${tile("Flags open", m.flags, true)}
    </div>
    ${leftOn}${banners}
    <div class="card">
      <div class="card-head"><h2>Live manifest</h2><span class="hint">Click a student for their history</span></div>
      ${section("Needs attention", attention)}
      ${section("Aboard", aboard)}
      ${section(ended ? "No show" : "Not boarded yet", waiting)}
      ${section("Dropped off", off)}
      ${attention.length + aboard.length + waiting.length + off.length ? ""
        : `<div class="empty-state">No roster and no scans yet.</div>`}
    </div>`;
}

async function routeAction(action) {
  const doorId = location.hash.slice("#bus/".length);
  await fetch(`/bus/${doorId}/route/${action}`, { method: "POST" });
  refresh();
}

// ----------------------------------------------------- page: student ----

async function showStudent(userId) {
  const s = await getJSON(`/student/${encodeURIComponent(userId)}`);
  if (!s) { location.hash = "students"; return; }

  // Where they are right now: first row of `now` (server puts "aboard" first).
  const now = s.now[0];
  const nowText = now
    ? `${pill(now.status)} <span class="muted">${esc(now.bus_name)}${now.on ? " · since " + clock(now.on) : ""}</span>`
    : `<span class="pill gray">Not on an active route</span>`;

  const rides = s.history.filter(r => r.on && r.status !== "rejected").length;
  const noShows = s.history.filter(r => r.status === "no_show").length;
  const flags = s.history.filter(r => FLAGGED.includes(r.status)).length;

  const rows = s.history.map(r => `
    <tr class="link" onclick="location.hash='bus/${encodeURIComponent(r.door_id)}'">
      <td>${day(r.route_started)}</td>
      <td><div class="cell"><span class="bus-badge small">${esc(busNumber(r.bus_name))}</span>${esc(r.bus_name)}</div></td>
      <td>${amPm(r.route_started)}</td>
      <td class="num">${r.on ? clock(r.on) : "—"}</td>
      <td class="num">${r.off ? clock(r.off) : "—"}</td>
      <td>${pill(r.status)}</td>
    </tr>`).join("");

  $("page").innerHTML = `
    <a class="back" href="#students">← All students</a>
    <div class="card"><div class="header">
      <div class="avatar big">${esc(initials(s.name))}</div>
      <div>
        <div class="title">${esc(s.name)}</div>
        <div class="muted">${s.buses.length ? "Assigned to " + esc(s.buses.join(", ")) : "Not assigned to a bus"}</div>
      </div>
      <div class="actions">${nowText}</div>
    </div></div>
    <div class="tiles">
      ${tile("Rides", rides)}
      ${tile("No shows", noShows, true)}
      ${tile("Flags", flags, true)}
      ${tile("Routes on record", s.history.length)}
    </div>
    <div class="card">
      <div class="card-head"><h2>Ridership history</h2><span class="hint">Newest first</span></div>
      ${rows ? `<table><thead><tr><th>Date</th><th>Bus</th><th>Route</th><th>On</th><th>Off</th><th>Status</th></tr></thead>
               <tbody>${rows}</tbody></table>`
             : `<div class="empty-state">No rides recorded yet.</div>`}
    </div>`;
}

// ---------------------------------------------------- page: students ----

let students = [];   // [{user_id, name, buses}], kept fresh by refresh()

function matching(query) {
  const q = query.trim().toLowerCase();
  return students.filter(s => s.name.toLowerCase().includes(q));
}

function showStudents() {
  const list = matching($("search").value);
  const rows = list.map(s => `
    <tr class="link" onclick="location.hash='student/${encodeURIComponent(s.user_id)}'">
      <td><div class="cell"><div class="avatar">${esc(initials(s.name))}</div>${esc(s.name)}</div></td>
      <td>${s.buses.length ? esc(s.buses.join(", ")) : `<span class="muted">Not assigned</span>`}</td>
    </tr>`).join("");
  $("page").innerHTML = `
    <h1>Students</h1>
    <div class="card">
      <div class="card-head"><h2>${list.length} of ${students.length} students</h2>
        <span class="hint">Type in the search bar to filter</span></div>
      ${rows ? `<table><thead><tr><th>Student</th><th>Assigned bus</th></tr></thead><tbody>${rows}</tbody></table>`
             : `<div class="empty-state">No students match.</div>`}
    </div>`;
}

// ------------------------------------------------------- search box ----

let searchPick = 0;   // which dropdown result Enter opens

function drawSearchResults() {
  const box = $("search-results");
  const query = $("search").value;
  if (!query.trim()) { box.hidden = true; return; }
  const hits = matching(query).slice(0, 8);
  searchPick = Math.min(searchPick, Math.max(hits.length - 1, 0));
  box.innerHTML = hits.length
    ? hits.map((s, i) => `
        <a href="#student/${encodeURIComponent(s.user_id)}" class="${i === searchPick ? "active" : ""}"
           onmousedown="event.preventDefault(); openStudent('${encodeURIComponent(s.user_id)}')">
          <div class="avatar">${esc(initials(s.name))}</div>
          <div><div>${esc(s.name)}</div><div class="muted">${esc(s.buses.join(", ") || "Not assigned")}</div></div>
        </a>`).join("")
    : `<div class="empty">No students match “${esc(query)}”</div>`;
  box.hidden = false;
}

function openStudent(encodedId) {
  location.hash = "student/" + encodedId;
  $("search").value = "";
  $("search").blur();
  $("search-results").hidden = true;
}

$("search").addEventListener("input", () => {
  searchPick = 0;
  drawSearchResults();
  if (location.hash === "#students") showStudents();
});
$("search").addEventListener("keydown", e => {
  const hits = matching($("search").value).slice(0, 8);
  if (e.key === "ArrowDown") { searchPick = Math.min(searchPick + 1, hits.length - 1); drawSearchResults(); e.preventDefault(); }
  if (e.key === "ArrowUp") { searchPick = Math.max(searchPick - 1, 0); drawSearchResults(); e.preventDefault(); }
  if (e.key === "Enter" && hits[searchPick]) openStudent(encodeURIComponent(hits[searchPick].user_id));
  if (e.key === "Escape") { $("search").blur(); }
});
$("search").addEventListener("focus", async () => {
  students = (await getJSON("/students")) || [];
  drawSearchResults();
});
$("search").addEventListener("blur", () => { $("search-results").hidden = true; });

// ---------------------------------------------------- roster refresh ----

async function refreshRoster() {
  $("roster-status").textContent = "Refreshing roster…";
  const r = await fetch("/roster/refresh", { method: "POST" });
  const body = await r.json();
  $("roster-status").textContent = r.ok ? `Loaded ${body.buses} doors from Command` : `Failed: ${body.error}`;
  refresh();
}

// ------------------------------------------------------ refresh loop ----
// The page is picked from the part of the URL after "#":
//   ""  buses overview  ·  "bus/<door_id>"  ·  "students"  ·  "student/<user_id>"

async function refresh() {
  const hash = decodeURIComponent(location.hash.slice(1));
  $("nav-buses").className = hash === "" || hash.startsWith("bus/") ? "active" : "";
  $("nav-students").className = hash.startsWith("student") ? "active" : "";

  if (hash.startsWith("bus/")) return showBus(hash.slice(4));
  if (hash.startsWith("student/")) return showStudent(hash.slice(8));
  if (hash === "students") {
    students = (await getJSON("/students")) || [];
    return showStudents();
  }
  return showOverview();
}

window.onhashchange = () => { window.scrollTo(0, 0); refresh(); };
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
