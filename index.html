<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Student Ridership</title>
<style>
  :root {
    --bg: #f5f7f9; --panel: #fff; --border: #e6e9ec; --line: #eef0f2;
    --text: #1f2933; --muted: #6b7684; --chip: #eef1f4; --outline: #c9cfd6;
    --blue: #1a88e0; --blue-soft: #e7f2fc;
    --green: #22a85a; --green-soft: #e6f6ec;
    --red: #d93a3a; --red-soft: #fdeeee;
    --amber: #d98a00; --amber-soft: #fdf3e1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; min-height: 100vh;
         font: 15px/1.4 "Open Sans", -apple-system, "Segoe UI", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  svg { flex: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .muted { color: var(--muted); }
  .spacer { flex: 1; }
  .divider { width: 1px; height: 24px; background: var(--border); flex: none; }
  .num { font-variant-numeric: tabular-nums; }

  /* left icon rail */
  .rail { width: 76px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
          display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0;
          position: sticky; top: 0; height: 100vh; }
  .rail a, .rail .deco { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #3c4650; }
  .rail .waffle { height: 32px; margin-top: 8px; }            /* visual only, not clickable */
  .rail .bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .rail .avatar { width: 40px; height: 40px; border-radius: 50%; background: #000; margin-top: 6px; }
  .rail a:hover { background: var(--chip); }
  .rail a.active { background: var(--blue); color: #fff; }

  .content { flex: 1; min-width: 0; padding: 20px 32px 40px; max-width: 1280px; }

  /* page title row: title | tabs ......... search  refresh */
  .page-head { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; min-height: 48px; }
  .page-head h1 { font-size: 26px; font-weight: 700; margin: 0; white-space: nowrap; }
  .tabs { display: flex; gap: 28px; align-self: stretch; }
  .tabs a { display: flex; align-items: center; color: var(--muted); font-weight: 500;
            border-bottom: 3px solid transparent; padding-top: 3px; }
  .tabs a:hover { color: var(--text); }
  .tabs a.active { color: var(--text); font-weight: 600; border-color: var(--text); }
  .search { position: relative; display: flex; align-items: center; gap: 10px; width: 320px; height: 44px;
            padding: 0 18px; background: var(--chip); border-radius: 999px; color: var(--muted); }
  .search input { border: 0; background: none; outline: none; font: inherit; color: var(--text); flex: 1; min-width: 0; }
  .search:focus-within { background: #fff; box-shadow: 0 0 0 1px var(--blue); }
  .dropdown { position: absolute; top: 52px; left: 0; right: 0; z-index: 20; background: var(--panel);
              border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.12); overflow: hidden; padding: 6px 0; }
  .dropdown a { display: flex; align-items: center; gap: 12px; padding: 8px 16px; color: var(--text); }
  .dropdown a:hover, .dropdown a.active { background: var(--blue-soft); }
  .dropdown .empty { padding: 12px 16px; }
  .sub { color: var(--muted); font-size: 14px; }

  /* buttons */
  .pill-btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; white-space: nowrap;
              background: var(--panel); border: 1px solid var(--outline); border-radius: 999px; font-weight: 500; }
  .pill-btn:hover { background: var(--chip); }
  .pill-btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .pill-btn.primary:hover { filter: brightness(.95); }
  .pill-btn.small { height: 34px; padding: 0 14px; font-size: 14px; }
  .round-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--outline);
               background: var(--panel); display: grid; place-items: center; flex: none; }
  .round-btn:hover { background: var(--chip); }

  /* panels and cards */
  .panel { background: var(--panel); border-radius: 12px; margin-bottom: 16px; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 18px 24px 10px; }
  .panel-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .panel-head .hint { margin-left: auto; font-size: 14px; color: var(--muted); }
  .count { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 1px 10px;
           font-size: 13px; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .card { background: var(--panel); border-radius: 12px; padding: 18px 24px; }
  .card-label { font-size: 14px; color: var(--muted); }
  .card-value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  /* fleet page boxes: round icon (same as Needs attention rows) + number + label */
  .card.icon-card { display: flex; align-items: center; gap: 16px; }
  .icon-card .card-value { margin-top: 0; line-height: 1.1; }
  /* Needs attention box: hover shows every open issue in the fleet */
  .card.has-preview { position: relative; cursor: default; }
  .card.has-preview::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px; } /* hover bridge to the pop-up */
  .card.has-preview .preview { right: 0; width: 360px; max-height: 420px; overflow-y: auto; }
  .card.has-preview:hover .preview { opacity: 1; transform: translateY(0); visibility: visible;
                                     transition-delay: 0s; }
  a.preview-row { color: inherit; text-decoration: none; }
  a.preview-row:hover { background: #f8fafb; }
  .empty-state { padding: 32px 24px; text-align: center; color: var(--muted); }

  /* boarding progress bar on the bus page */
  .progress { padding: 20px 24px; }
  .progress-head { display: flex; align-items: baseline; gap: 10px; }
  .progress-big { font-size: 24px; font-weight: 600; }
  .progress-head .pct { margin-left: auto; color: var(--muted); font-size: 14px; font-weight: 500; }
  .bar { display: flex; height: 14px; border-radius: 999px; background: #e4e8ec; margin: 12px 0; }
  .bar span { height: 100%; transition: width .3s, filter .15s; position: relative; }
  .bar span:first-child { border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
  .bar span:last-child { border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
  .bar .light { background: #e4e8ec; }
  .bar span:hover { filter: brightness(.92); }
  /* hover label above a bar part, e.g. "12 aboard" */
  .bar span::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translate(-50%, 4px); background: #1f2933; color: #fff; font-size: 13px; font-weight: 500;
    padding: 4px 10px; border-radius: 6px; white-space: nowrap; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity .15s ease, transform .15s ease; }
  .bar span:hover::after { opacity: 1; transform: translate(-50%, 0); }   /* fades in and rises slightly */
  .bar .green { background: var(--green); } .bar .red { background: var(--red); }
  .bar .blue { background: var(--blue); }
  .dot.blue { background: var(--blue); }
  .dot.light { background: #e4e8ec; }   /* same gray as the "not boarded / no show" part of the bar */
  /* same bar in the overview table, a bit thinner */
  td.boarding { width: 55%; }
  .boarding-row { display: flex; align-items: center; gap: 16px; }
  .boarding-row > .num { width: 120px; flex: none; text-align: right; }
  td.boarding .bar { flex: 1; height: 10px; margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 24px; }

  /* header panel on bus and student pages */
  .head-panel { display: flex; align-items: center; gap: 18px; padding: 20px 24px; }
  .head-text { flex: 1; min-width: 0; }
  .head-title { font-size: 21px; font-weight: 600; }
  .status-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px;
                 font-size: 14px; font-weight: 500; }
  .status-line .divider { height: 16px; }
  .head-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  /* bus picture, no box: sits on the panel's own background */
  .bus-badge { width: 80px; height: 60px; flex: none;
               object-fit: contain; padding: 6px; }
  .bus-badge.small { width: 48px; height: 36px; border-radius: 6px; padding: 3px; }

  /* status = colored dot + text, like Command's "● Online" */
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex: none; }
  .dot.green { background: var(--green); } .dot.red { background: var(--red); }
  .dot.amber { background: var(--amber); } .dot.gray { background: #b4bcc5; }
  /* radar ping for buses en route: a ring grows out of the dot and fades */
  .dot.pulse { position: relative; }
  .dot.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit;
                      animation: ping 1.6s ease-out infinite; animation-delay: inherit; }
  @keyframes ping { 0% { transform: scale(1); opacity: .6; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
  /* "Refreshing roster..." — the three dots fade in one after another */
  .loading-dots span { animation: dot-fade 1.4s infinite; opacity: 0; }
  .loading-dots span:nth-child(2) { animation-delay: .2s; }
  .loading-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dot-fade { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
  .status { display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; white-space: nowrap; }

  /* avatars */
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #e4e8ec; color: #4a5560;
            display: grid; place-items: center; font-size: 15px; font-weight: 600; flex: none; }
  .avatar.small { width: 34px; height: 34px; font-size: 13px; }
  .avatar.big { width: 60px; height: 60px; font-size: 20px; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  /* "Needs attention": rows styled like Command event cards */
  .event { display: flex; align-items: center; gap: 16px; padding: 14px 24px; }
  .event + .event { border-top: 1px solid var(--line); }
  .event-icon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .event-icon.red { background: var(--red-soft); color: var(--red); }
  .event-icon.amber { background: var(--amber-soft); color: var(--amber); }
  .event-icon.green { background: var(--green-soft); color: var(--green); }
  .event-title { font-weight: 600; }
  .event-title.red { color: var(--red); } .event-title.amber { color: var(--amber); }
  .event-title.green { color: var(--green); }
  .event-icon.gray { background: #eef0f3; color: var(--muted); }   /* resolved issues */
  .event-title.gray { color: var(--muted); }
  .event-body { flex: 1; min-width: 0; }
  .event-time { color: var(--muted); font-size: 14px; margin-right: 8px; white-space: nowrap; }
  .event a.name { font-weight: 600; }
  .event a.name:hover { color: var(--blue); }

  /* passenger list: rows like Command's door and user lists */
  /* each group (Aboard / Not boarded / Dropped off) is its own rounded box */
  .group-box { margin: 12px 24px 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .group { display: flex; align-items: center; gap: 8px; padding: 10px 24px;
           background: #f8f9fb; border-bottom: 1px solid var(--line);
           font-size: 14px; font-weight: 600; list-style: none; }
  details.group-box:not([open]) .group { border-bottom: 0; }
  .group-box .row:last-child .row-main { border-bottom: 0; }
  .group svg { color: var(--muted); }
  details > summary.group { cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .chev { transition: transform .15s; }
  details[open] .chev { transform: rotate(90deg); }
  .row { display: flex; align-items: center; padding: 0 24px 0 48px; cursor: pointer; }
  .row:hover { background: #f8fafb; }
  .row.flagged { background: #fffaf0; }
  .row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; padding: 12px 0;
              border-bottom: 1px solid var(--line); }
  .row .who { flex: 1; min-width: 0; }
  .row .status { width: 170px; }

  /* tables (bus overview, students, ride history) */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 14px; font-weight: 600; color: var(--muted); padding: 14px 24px;
       background: #f8f9fb; border-bottom: 1px solid var(--line); }
  td { padding: 12px 24px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tr.link { cursor: pointer; }
  tr.link:hover td { background: #f8fafb; }
  td .cell { display: flex; align-items: center; gap: 14px; }
  td .strong { font-weight: 600; }
  .red-text { color: var(--red); font-weight: 600; }
  /* overview "Needs attention" cell: warning sign + count, or a check */
  .attn { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .attn.amber { color: var(--amber); } .attn.green { color: var(--green); } .attn.red { color: var(--red); }
  .attn-text { color: var(--muted); font-weight: 500; font-size: 14px; }
  /* hover preview of a bus's issues */
  .attn-wrap { position: relative; display: inline-block; }
  /* Invisible strip over the 8px gap down to the pop-up, so moving the
     mouse onto the pop-up doesn't count as leaving. */
  .attn-wrap::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px; }
  /* Hidden with `visibility` so it can wait .2 s before hiding: a quick or
     slightly off-line mouse move onto the pop-up still makes it. */
  .preview { position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; width: 320px;
             background: var(--panel); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.15);
             padding: 6px 0; white-space: normal;
             opacity: 0; transform: translateY(-4px); visibility: hidden;
             transition: opacity .15s ease .2s, transform .15s ease .2s, visibility 0s linear .35s; }
  .attn-wrap:hover .preview { opacity: 1; transform: translateY(0); visibility: visible;
                              transition-delay: 0s; }
  .preview-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
  .preview-row + .preview-row { border-top: 1px solid var(--line); }
  .preview-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
                  background: var(--amber-soft); color: var(--amber); }
  .preview-icon.red { background: var(--red-soft); color: var(--red); }
  .preview-text { flex: 1; min-width: 0; font-size: 14px; }
  .preview-more { padding: 8px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

  /* camera clip buttons */
  .clip { width: 38px; height: 38px; border-radius: 50%; color: #3c4650; flex: none;
          display: inline-grid; place-items: center; vertical-align: middle; }
  a.clip:hover { background: var(--blue-soft); color: var(--blue); }
  .clip.none { opacity: .3; }
  td .clip { width: 32px; height: 32px; margin-left: 4px; }

  /* clip player pop-up */
  .overlay { position: fixed; inset: 0; background: rgba(15, 20, 30, .55); z-index: 50;
             display: grid; place-items: center; padding: 24px; }
  .overlay[hidden] { display: none; }
  .player-card { background: var(--panel); border-radius: 12px; width: min(840px, 100%); overflow: hidden;
                 box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .player-card .panel-head { padding: 14px 16px 14px 24px; }
  .player-card .round-btn { width: 38px; height: 38px; margin-left: auto; }
  .player-card video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .player-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; }

  /* narrow windows (laptop split screen, tablet) */
  @media (max-width: 1000px) {
    .content { padding: 16px; }
    .page-head { flex-wrap: wrap; }
    .search { width: 100%; order: 5; }
    .cards { grid-template-columns: repeat(2, 1fr); }
    .panel { overflow-x: auto; }
    .head-panel { flex-wrap: wrap; }
    .head-actions { margin-left: 0; width: 100%; }
    .row { padding-left: 24px; }
    .row .status { width: auto; }
  }
</style>
</head>
<body>

  <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.1"/></symbol>

    <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2M3 13h18M8 11.5v3M16 11.5v3"/></symbol>
</svg>

<nav class="rail">
  <span class="deco waffle"><svg width="22" height="22"><use href="#i-waffle"/></svg></span>
  <a href="#" id="rail-buses" title="Buses"><svg width="24" height="24"><use href="#i-bus"/></svg></a>
  <a href="#students" id="rail-students" title="Students"><svg width="24" height="24"><use href="#i-people"/></svg></a>

    <span class="deco"><svg width="24" height="24"><use href="#i-bugdoc"/></svg></span>
    <span class="deco"><svg width="24" height="24"><use href="#i-bell"/></svg></span>

<div class="content">
  <!-- Stays put on every page (so the search box keeps focus while pages redraw). -->
  <header class="page-head">
    <h1>Student Ridership</h1>
    <span class="divider"></span>
    <nav class="tabs">
      <a href="#" id="tab-buses">Buses</a>
      <a href="#students" id="tab-students">Students</a>
    </nav>
    <span class="spacer"></span>
    <label class="search">
      <svg width="20" height="20"><use href="#i-search"/></svg>
      <input id="search" placeholder="Search students..." autocomplete="off">
      <div id="search-results" class="dropdown" hidden></div>
    </label>
    <span id="roster-status" class="sub"></span>
    <button class="pill-btn" onclick="refreshRoster()">
      <svg width="18" height="18"><use href="#i-refresh"/></svg>Refresh roster</button>
  </header>

  <!-- Each page is drawn into #page by one of the show... functions below. -->
  <main id="page"></main>
</div>

<!-- Clip player: footage around a scan. Opened by openClip(). -->
<div id="player" class="overlay" hidden onclick="if (event.target === this) closeClip()">
  <div class="player-card">
    <div class="panel-head">
      <h2 id="player-title"></h2>
      <button class="round-btn" title="Close" onclick="closeClip()">
        <svg width="18" height="18"><use href="#i-close"/></svg></button>
    </div>
    <video id="player-video" muted loop playsinline controls></video>
    <div class="player-foot">
      <span id="player-status" class="sub"></span>
      <a id="player-command" class="pill-btn small" target="_blank">Open in Command ↗</a>
    </div>
  </div>
</div>

<!-- hls.js plays Verkada's HLS stream in Chrome/Firefox (Safari can play it natively). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.16/hls.min.js"></script>

<script>
// ------------------------------------------------------------ helpers ----

const $ = id => document.getElementById(id);

// Escape text before putting it into HTML.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function clock(t) { return new Date(t * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); }
function day(t) { return new Date(t * 1000).toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"}); }
function amPm(t) { return new Date(t * 1000).getHours() < 12 ? "AM" : "PM"; }
function ago(t) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - t));
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return day(t);
}
function initials(name) {
  return String(name).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
}

// Profile photos from Command: {user_id: version}. Loaded at start and after
// "Refresh roster". No photo -> initials, like Command.
let photos = {};
async function loadPhotos() { photos = (await getJSON("/photos")) || {}; }
function avatar(userId, name, size = "") {
  const v = photos[userId];
  const inner = v ? `<img src="/photo/${encodeURIComponent(userId)}?v=${v}" alt="">` : esc(initials(name));
  return `<div class="avatar ${size}">${inner}</div>`;
}
async function getJSON(url) { const r = await fetch(url); return r.ok ? r.json() : null; }
function icon(name, size = 20) { return `<svg width="${size}" height="${size}"><use href="#i-${name}"/></svg>`; }

// status -> [label, dot color]. Same names the server uses.
const STATUS = {
  aboard:      ["Aboard", "green"],
  dropped_off: ["Dropped off", "gray"],
  not_boarded: ["Not boarded yet", "gray"],
  no_show:     ["No show", "amber"],
  left_on_bus: ["Never tapped off", "red"],
  wrong_bus:   ["Wrong bus", "amber"],
  rejected:    ["Rejected scan", "amber"],
};
const FLAGGED = ["left_on_bus", "wrong_bus", "rejected"];

function status(name) {
  const [label, color] = STATUS[name];
  return `<span class="status"><span class="dot ${color}"></span>${label}</span>`;
}
// "● En route since 3:05 PM" / "● Route ended 4:02 PM" / "● No route yet"
// pulse: make the green dot gently blink (used on the overview).
function routeStatus(route, pulse = false) {
  if (!route) return `<span class="status muted"><span class="dot gray"></span>No route yet</span>`;
  if (route.ended_at !== null) return `<span class="status"><span class="dot gray"></span>Route ended ${clock(route.ended_at)}</span>`;
  // The page redraws every 2 s, which would restart the blink. Starting the
  // animation at "where it would be now" keeps it smooth across redraws.
  const phase = pulse ? ` pulse" style="animation-delay:-${(Date.now() % 1600) / 1000}s` : "";
  return `<span class="status"><span class="dot green${phase}"></span>En route since ${clock(route.started_at)}</span>`;
}
// Fleet page box: colored round icon, then the number, then the label under it.
// color: "green" / "gray" / "red" / "amber" (the .event-icon colors).
// preview: optional hover pop-up (from issuePreview).
function iconCard(iconName, color, label, value, preview = "") {
  return `<div class="card icon-card ${preview ? "has-preview" : ""}">
    <div class="event-icon ${color}">${icon(iconName, 24)}</div>
    <div><div class="card-value num">${value}</div><div class="card-label">${label}</div></div>
    ${preview}
  </div>`;
}
// Boarding progress bar: dropped off (green), then aboard (blue, or red once
// the route has ended), then not boarded (light gray). Hover a part for its count.
function progressBar(nOff, nAboard, nTotal, ended) {
  const nWaiting = nTotal - nOff - nAboard;
  const part = (cls, n, label) => n > 0
    ? `<span class="${cls}" style="width:${100 * n / nTotal}%" data-tip="${n} ${label}"></span>` : "";
  return `<div class="bar">
    ${part("green", nOff, "dropped off")}
    ${part(ended ? "red" : "blue", nAboard, ended ? "still on bus" : "aboard")}
    ${part("light", nWaiting, ended ? "no show" : "not boarded yet")}
  </div>`;
}
function backButton(hash, title) {
  return `<a class="round-btn" href="${hash}" title="${title}">${icon("back", 22)}</a>`;
}

// Clip icon: opens the clip player at the scan. Crossed-out camera when
// there's no camera for that bus.
function clip(cameraId, time, title) {
  if (!cameraId || !time) return `<span class="clip none" title="No clip">${icon("nocamera")}</span>`;
  return clipLink(cameraId, time, title, icon("camera"));
}
// A link that opens the clip player. The click is handled once, below
// ("clip clicks"), using these data- attributes.
function clipLink(cameraId, time, title, inner, cls = "clip") {
  return `<a class="${cls}" href="#" title="Play clip" data-camera="${esc(cameraId)}"
             data-at="${time}" data-title="${esc(title)}">${inner}</a>`;
}

// One student row in the passenger list.
function personRow(userId, name, sub, statusName, clipHtml) {
  const flagged = FLAGGED.includes(statusName) ? "flagged" : "";
  return `<div class="row ${flagged}" onclick="location.hash='student/${encodeURIComponent(userId)}'">
    <div class="row-main">
      ${avatar(userId, name)}
      <div class="who"><div>${esc(name)}</div><div class="sub">${sub}</div></div>
      ${status(statusName)}${clipHtml}
    </div></div>`;
}

// One row in "Needs attention". color: "red" / "amber" / "green".
function eventRow(color, iconName, title, text, time, clipHtml) {
  return `<div class="event">
    <div class="event-icon ${color}">${icon(iconName, 22)}</div>
    <div class="event-body"><div class="event-title ${color}">${title}</div><div>${text}</div></div>
    ${time ? `<span class="event-time">${clock(time)}</span>` : ""}${clipHtml}
  </div>`;
}
function viewClip(cameraId, time, title) {
  return cameraId ? clipLink(cameraId, time, title, `${icon("camera", 18)}View clip`, "pill-btn small") : "";
}
function studentLink(userId, name) {
  return `<a class="name" href="#student/${encodeURIComponent(userId)}">${esc(name)}</a>`;
}

// ------------------------------------------------------- page: buses ----

// Overview table cell: "38 of 50 boarded" + bar + counts. Same bar as the bus page.
function boardingCell(b) {
  if (!b.route) return `<span class="muted">${b.roster} on roster</span>`;
  const ended = b.route.ended_at !== null;
  const nTotal = b.roster_on + b.roster_off + b.not_boarded;
  return `<div class="boarding-row">
    ${progressBar(b.roster_off, b.roster_on, nTotal, ended)}
    <span class="num"><span class="strong">${b.roster_on + b.roster_off}/${nTotal}</span> <span class="muted">boarded</span></span>
  </div>`;
}

// Pop-up list of issues, shown on hover. Shows up to `max`.
// Issues with a door_id are links to that bus's page. Issues with a bus
// name (the fleet-wide list) also show which bus.
function issuePreview(issues, max = 5) {
  // Same icon and color as the bus page: card problems amber, rider problems red.
  const rows = issues.slice(0, max).map(i => {
    const isCard = i.title.toLowerCase().includes("card");
    const inner = `
      <span class="preview-icon ${isCard ? "amber" : "red"}">${icon(isCard ? "card" : "warn", 16)}</span>
      <div class="preview-text"><div class="strong">${esc(i.title)}</div>
        <div class="sub">${esc(i.who)}${i.bus ? " · " + esc(i.bus) : ""}</div></div>
      <span class="sub">${clock(i.time)}</span>`;
    return i.door_id
      ? `<a class="preview-row link" href="#bus/${encodeURIComponent(i.door_id)}">${inner}</a>`
      : `<div class="preview-row">${inner}</div>`;
  }).join("");
  const more = issues.length > max
    ? `<div class="preview-more"><b>+${issues.length - max} more</b> · click the bus to see all ${issues.length}</div>` : "";
  return `<div class="preview">${rows}${more}</div>`;
}

async function showOverview() {
  const buses = await getJSON("/buses");
  // En-route buses first; otherwise keep the server's name order.
  const isEnRoute = b => b.route && b.route.ended_at === null;
  buses.sort((a, b) => isEnRoute(b) - isEnRoute(a));
  const enRoute = buses.filter(isEnRoute).length;
  const finished = buses.filter(b => b.route && b.route.ended_at !== null).length;
  const notStarted = buses.filter(b => !b.route).length;
  // Every open issue on every bus, for the Needs attention box's hover list.
  // Students left on a bus first, then newest first.
  const leftOn = i => i.title === "Never tapped off";
  const allIssues = buses.flatMap(b => b.issues.map(i => ({ ...i, bus: b.name, door_id: b.door_id })))
    .sort((a, b) => (leftOn(b) - leftOn(a)) || (b.time - a.time));
  const issues = allIssues.length;
  const leftOnBus = allIssues.some(leftOn);

  const rows = buses.map(b => `
    <tr class="link" onclick="location.hash='bus/${encodeURIComponent(b.door_id)}'">
      <td><div class="cell"><img class="bus-badge small" src="/bus.png" alt="">
        <div><div class="strong">${esc(b.name)}</div>${routeStatus(b.route, true)}</div></div></td>
      <td class="boarding">${boardingCell(b)}</td>
      <td>${b.flags
        ? `<span class="attn-wrap"><span class="attn ${b.issues.some(i => i.title === "Never tapped off") ? "red" : "amber"}">${icon("warn", 18)}<span class="num">${b.flags}</span>
             <span class="attn-text">${b.flags === 1 ? "issue" : "issues"} to review</span></span>
             ${issuePreview(b.issues.map(i => ({ ...i, door_id: b.door_id })))}</span>`
        : `<span class="attn green">${icon("check", 18)}<span class="attn-text">No issues</span></span>`}</td>
    </tr>`).join("");

  $("page").innerHTML = `
    <div class="cards">
      ${iconCard("bus", enRoute ? "green" : "gray", "En route", enRoute)}
      ${iconCard("check", "gray", "Route finished", finished)}
      ${iconCard("clock", "gray", "Not started", notStarted)}
      ${issues === 0 ? iconCard("check", "green", "All clear", 0)
        // red if anyone was left on a bus, amber for the rest (same as the table column)
        : iconCard("warn", leftOnBus ? "red" : "amber", "Needs attention", issues,
                   issuePreview(allIssues, Infinity))}
    </div>
    <section class="panel">
      <div class="panel-head"><h2>Buses</h2><span class="count">${buses.length}</span>
        <span class="hint">Click a bus for its live passenger list</span></div>
      ${buses.length ? `<table>
        <thead><tr><th>Bus</th><th>Boarding</th><th>Needs attention</th></tr></thead>
        <tbody>${rows}</tbody></table>`
      : `<div class="empty-state">No buses yet. Press Refresh roster, or tap a card on any reader.</div>`}
    </section>`;
}

// --------------------------------------------------------- page: bus ----

let droppedOpen = false;   // is the "Dropped off" group expanded? (kept across redraws)
let resolvedOpen = false;  // same for the "Resolved" group under Needs attention

async function resolveIssue(key) {
  const doorId = location.hash.slice("#bus/".length);
  await fetch(`/bus/${doorId}/resolve`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key }),
  });
  refresh();
}

async function showBus(doorId) {
  const m = await getJSON(`/bus/${encodeURIComponent(doorId)}`);
  if (!m) { location.hash = ""; return; }
  const enRoute = m.route && m.route.ended_at === null;
  const ended = m.route && m.route.ended_at !== null;

  // Passenger rows, by group, plus the problems for "Needs attention".
  // The problems match the server's flag count: rejected scans, wrong-bus
  // riders, and (after the route ends) anyone who never tapped off.
  // Each problem has a key (same as the server's list_flags). Resolved ones
  // go to `resolved` instead, shown in a collapsed group.
  const problems = [], resolved = [], aboard = [], waiting = [], off = [];
  // button / done: wording for the button and for the resolved row.
  function issue(key, color, iconName, title, text, time, clipBtn,
                 button = "Resolve", done = "Resolved") {
    const at = m.resolved[key];
    if (at) {
      resolved.push(eventRow("gray", iconName, title, text, time,
        `<span class="status"><span class="dot green"></span>${done} ${clock(at)}</span>${clipBtn}`));
    } else {
      problems.push(eventRow(color, iconName, title, text, time,
        clipBtn + `<button class="pill-btn small" data-key="${esc(key)}" onclick="resolveIssue(this.dataset.key)">${button}</button>`));
    }
  }
  const neverOff = (s, title) => issue(`never_off:${s.user_id}`, "red", "warn", "Never tapped off",
    `${studentLink(s.user_id, s.name)} <span class="muted">was still on the bus when the route ended. Check the bus.</span>`,
    s.on_at, viewClip(s.on_camera, s.on_at, title), "Mark as dropped off", "Marked dropped off");
  for (const s of m.on_bus) {
    const st = s.wrong_bus ? "wrong_bus" : ended ? "left_on_bus" : "aboard";
    const title = `${s.name} · boarded ${m.name} · ${clock(s.on_at)}`;
    const sub = `On at ${clock(s.on_at)}` + (s.wrong_bus ? " · not on this bus's roster" : "");
    aboard.push(personRow(s.user_id, s.name, sub, st, clip(s.on_camera, s.on_at, title)));
    if (s.wrong_bus) {
      issue(`wrong_bus:${s.user_id}`, "red", "warn", "Wrong bus",
        `${studentLink(s.user_id, s.name)} <span class="muted">${ended ? "was still aboard at the end, and is" : "is aboard but"} not on this bus's roster</span>`,
        s.on_at, viewClip(s.on_camera, s.on_at, title));
    } else if (ended) {
      neverOff(s, title);
    }
  }
  for (const s of m.off_bus) {
    if (s.marked_off) {
      // Never tapped off; someone pressed "Mark as dropped off". Clip is the boarding scan.
      const title = `${s.name} · boarded ${m.name} · ${clock(s.on_at)}`;
      off.push(personRow(s.user_id, s.name, `On at ${clock(s.on_at)} · marked dropped off at ${clock(s.marked_off)}`,
        "dropped_off", clip(s.on_camera, s.on_at, title)));
      neverOff(s, title);
      continue;
    }
    const title = `${s.name} · got off ${m.name} · ${clock(s.last_tap)}`;
    off.push(personRow(s.user_id, s.name, `On at ${clock(s.on_at)} · off at ${clock(s.last_tap)}`,
      s.wrong_bus ? "wrong_bus" : "dropped_off", clip(s.last_camera, s.last_tap, title)));
    if (s.wrong_bus) {
      issue(`wrong_bus:${s.user_id}`, "red", "warn", "Wrong bus",
        `${studentLink(s.user_id, s.name)} <span class="muted">rode this bus but is not on its roster</span>`,
        s.on_at, viewClip(s.on_camera, s.on_at, `${s.name} · boarded ${m.name} · ${clock(s.on_at)}`));
    }
  }
  for (const s of m.not_boarded) {
    waiting.push(personRow(s.user_id, s.name, m.route ? "No scan recorded" : "On this bus's roster",
      ended ? "no_show" : "not_boarded", `<span class="clip"></span>`));
  }
  // Rejected scans (newest first from the server).
  for (const a of m.alerts) {
    const who = a.user_id ? a.name : `Card ${a.card}`;
    const clipBtn = viewClip(a.camera_id, a.time, `${who} · rejected at ${m.name} · ${clock(a.time)}`);
    if (a.user_id) {
      const where = a.assigned.length ? `assigned to ${esc(a.assigned.join(", "))}` : "not assigned to any bus";
      issue(`alert:${a.event_id}`, "amber", "card", "Card rejected",
        `${studentLink(a.user_id, a.name)} <span class="muted">scanned here, ${where}</span>`, a.time, clipBtn);
    } else {
      issue(`alert:${a.event_id}`, "amber", "card", "Unrecognized card",
        `<b>Card ${esc(a.card)}</b> <span class="muted">is not linked to any student</span>`, a.time, clipBtn);
    }
  }

  // Most recent scan of any kind, so a stale count is never mistaken for "all clear".
  const times = [...m.on_bus.map(s => s.last_tap), ...m.off_bus.map(s => s.last_tap), ...m.alerts.map(a => a.time)];
  const lastScan = times.length ? `Last scan ${ago(Math.max(...times))}` : "No scans yet";

  const attention = !m.route ? "" : `
    <section class="panel">
      <div class="panel-head"><h2>Needs attention</h2><span class="count">${problems.length}</span></div>
      ${problems.length ? problems.join("")
        : eventRow("green", "check", "All clear", `<span class="muted">No open problems on this route.</span>`, null, "")}
      ${resolved.length ? `<details class="group-box" ${resolvedOpen ? "open" : ""} ontoggle="resolvedOpen = this.open">
          <summary class="group">${icon("chev", 16)}Resolved<span class="count">${resolved.length}</span></summary>${resolved.join("")}
        </details><div style="height:12px"></div>` : ""}
    </section>`;

  // Boarding progress: roster students who scanned on, out of the roster.
  // Wrong-bus riders aren't on the roster, so they're left out of the bar.
  const onRoster = s => !s.wrong_bus;
  const nAboard = m.on_bus.filter(onRoster).length;
  const nOff = m.off_bus.filter(onRoster).length;
  const nWaiting = m.not_boarded.length;
  const nTotal = nAboard + nOff + nWaiting;
  const pct = n => nTotal ? (100 * n / nTotal) : 0;
  const nWrong = m.on_bus.length + m.off_bus.length - nAboard - nOff;
  // Label and number in one inner span: .status is a flex box, which drops the
  // space before the number if they're separate items.
  const legendItem = (color, label, n) => `<span class="status"><span class="dot ${color}"></span><span>${label} · <span class="num">${n}</span></span></span>`;
  const progress = !m.route ? "" : `
    <section class="panel progress">
      <div class="progress-head">
        <span class="progress-big num">${nAboard + nOff} of ${nTotal}</span><span class="muted">boarded</span>
        <span class="pct num">${Math.round(pct(nAboard + nOff))}%</span>
      </div>
      ${progressBar(nOff, nAboard, nTotal, ended)}
      <div class="legend">
        ${legendItem("green", "Dropped off", nOff)}
        ${legendItem(ended ? "red" : "blue", ended ? "Still on bus" : "Aboard", nAboard)}
        ${legendItem("light", ended ? "No show" : "Not boarded yet", nWaiting)}
        ${nWrong ? legendItem("amber", "Not on roster", nWrong) : ""}
      </div>
    </section>`;

  const group = (iconName, label, rows) => rows.length
    ? `<div class="group-box"><div class="group">${icon(iconName, 16)}${label}<span class="count">${rows.length}</span></div>${rows.join("")}</div>` : "";

  $("page").innerHTML = `
    <section class="panel head-panel">
      ${backButton("#", "All buses")}
      <img class="bus-badge" src="/bus.png" alt="">
      <div class="head-text">
        <div class="head-title">${esc(m.name)}</div>
        <div class="status-line">
          ${routeStatus(m.route)}
          ${m.route ? `<span class="divider"></span><span class="muted">${lastScan}</span>` : ""}
          <span class="divider"></span><span class="muted">${m.roster.length} on roster</span>
        </div>
      </div>
      <div class="head-actions">
        ${enRoute
          ? `<button class="pill-btn" onclick="routeAction('end')">End route</button>`
          : `<button class="pill-btn primary" onclick="routeAction('start')">Start route</button>`}
      </div>
    </section>
    ${progress}
    ${attention}
    <section class="panel">
      <div class="panel-head"><h2>Passengers</h2>
        <span class="hint">Click a student for their history · camera for the scan clip</span></div>
      ${group("bus", ended ? "Still on bus" : "Aboard", aboard)}
      ${group("people", ended ? "No show" : "Not boarded yet", waiting)}
      ${off.length ? `<details class="group-box" ${droppedOpen ? "open" : ""} ontoggle="droppedOpen = this.open">
          <summary class="group">${icon("chev", 16)}Dropped off<span class="count">${off.length}</span></summary>${off.join("")}
        </details>` : ""}
      ${aboard.length + waiting.length + off.length ? `<div style="height:12px"></div>`
        : `<div class="empty-state">No roster and no scans yet.</div>`}
    </section>`;
}

async function routeAction(action) {
  const doorId = location.hash.slice("#bus/".length);
  await fetch(`/bus/${doorId}/route/${action}`, { method: "POST" });
  refresh();
}

// ----------------------------------------------------- page: student ----

async function showStudent(userId) {
  const s = await getJSON(`/student/${encodeURIComponent(userId)}`);
  if (!s) { location.hash = "students"; return; }

  // Where they are right now: first row of `now` (server puts "aboard" first).
  const now = s.now[0];
  const nowText = now
    ? `${status(now.status)}<span class="muted">${esc(now.bus_name)}${now.on ? " since " + clock(now.on) : ""}</span>`
    : `<span class="status muted"><span class="dot gray"></span>Not on an active route</span>`;

  const rides = s.history.filter(r => r.on && r.status !== "rejected").length;
  const noShows = s.history.filter(r => r.status === "no_show").length;
  const flags = s.history.filter(r => FLAGGED.includes(r.status)).length;

  const rows = s.history.map(r => `
    <tr class="link" onclick="location.hash='bus/${encodeURIComponent(r.door_id)}'">
      <td>${day(r.route_started)}</td>
      <td><div class="cell"><img class="bus-badge small" src="/bus.png" alt="">${esc(r.bus_name)}</div></td>
      <td>${amPm(r.route_started)}</td>
      <td class="num">${r.on ? clock(r.on) + clip(r.on_camera, r.on,
        `${s.name} · ${r.status === "rejected" ? "rejected at" : "boarded"} ${r.bus_name} · ${day(r.on)} ${clock(r.on)}`) : "—"}</td>
      <td class="num">${r.off ? clock(r.off) + clip(r.off_camera, r.off,
        `${s.name} · got off ${r.bus_name} · ${day(r.off)} ${clock(r.off)}`) : "—"}</td>
      <td>${status(r.status)}${r.resolved_at ? ` <span class="muted">· ${r.status === "dropped_off" ? "Marked" : "Resolved"} ${day(r.resolved_at)} ${clock(r.resolved_at)}</span>` : ""}</td>
    </tr>`).join("");

  $("page").innerHTML = `
    <section class="panel head-panel">
      ${backButton("#students", "All students")}
      ${avatar(s.user_id, s.name, "big")}
      <div class="head-text">
        <div class="head-title">${esc(s.name)}</div>
        <div class="status-line">
          ${nowText}
          <span class="divider"></span>
          <span class="muted">${s.buses.length ? "Assigned to " + esc(s.buses.join(", ")) : "Not assigned to a bus"}</span>
        </div>
      </div>
    </section>
    <div class="cards">
      ${iconCard("bus", rides ? "green" : "gray", "Rides", rides)}
      ${iconCard("close", noShows ? "red" : "gray", "No shows", noShows)}
      ${iconCard("warn", flags ? "red" : "gray", "Flags", flags)}
      ${iconCard("list", "gray", "Entries", s.history.length)}
    </div>
    <section class="panel">
      <div class="panel-head"><h2>Ridership history</h2><span class="count">${s.history.length}</span>
        <span class="hint">Newest first · click a row for that bus</span></div>
      ${rows ? `<table><thead><tr><th>Date</th><th>Bus</th><th>Route</th><th>On</th><th>Off</th><th>Status</th></tr></thead>
               <tbody>${rows}</tbody></table>`
             : `<div class="empty-state">No rides recorded yet.</div>`}
    </section>`;
}

// ---------------------------------------------------- page: students ----

let students = [];   // [{user_id, name, buses}], kept fresh by refresh()

function matching(query) {
  const q = query.trim().toLowerCase();
  return students.filter(s => s.name.toLowerCase().includes(q));
}

function showStudents() {
  const list = matching($("search").value);
  const rows = list.map(s => `
    <tr class="link" onclick="location.hash='student/${encodeURIComponent(s.user_id)}'">
      <td><div class="cell">${avatar(s.user_id, s.name, "small")}<span class="strong">${esc(s.name)}</span></div></td>
      <td>${s.buses.length ? esc(s.buses.join(", ")) : `<span class="muted">Not assigned</span>`}</td>
    </tr>`).join("");
  $("page").innerHTML = `
    <section class="panel">
      <div class="panel-head"><h2>Students</h2><span class="count">${list.length} of ${students.length}</span>
        <span class="hint">Type in the search bar to filter</span></div>
      ${rows ? `<table><thead><tr><th>Student</th><th>Assigned bus</th></tr></thead><tbody>${rows}</tbody></table>`
             : `<div class="empty-state">No students match.</div>`}
    </section>`;
}

// ------------------------------------------------------- search box ----

let searchPick = 0;   // which dropdown result Enter opens

function drawSearchResults() {
  const box = $("search-results");
  const query = $("search").value;
  if (!query.trim()) { box.hidden = true; return; }
  const hits = matching(query).slice(0, 8);
  searchPick = Math.min(searchPick, Math.max(hits.length - 1, 0));
  box.innerHTML = hits.length
    ? hits.map((s, i) => `
        <a href="#student/${encodeURIComponent(s.user_id)}" class="${i === searchPick ? "active" : ""}"
           onmousedown="event.preventDefault(); openStudent('${encodeURIComponent(s.user_id)}')">
          ${avatar(s.user_id, s.name, "small")}
          <div><div>${esc(s.name)}</div><div class="sub">${esc(s.buses.join(", ") || "Not assigned")}</div></div>
        </a>`).join("")
    : `<div class="empty sub">No students match “${esc(query)}”</div>`;
  box.hidden = false;
}

function openStudent(encodedId) {
  location.hash = "student/" + encodedId;
  $("search").value = "";
  $("search").blur();
  $("search-results").hidden = true;
}

$("search").addEventListener("input", () => {
  searchPick = 0;
  drawSearchResults();
  if (location.hash === "#students") showStudents();
});
$("search").addEventListener("keydown", e => {
  const hits = matching($("search").value).slice(0, 8);
  if (e.key === "ArrowDown") { searchPick = Math.min(searchPick + 1, hits.length - 1); drawSearchResults(); e.preventDefault(); }
  if (e.key === "ArrowUp") { searchPick = Math.max(searchPick - 1, 0); drawSearchResults(); e.preventDefault(); }
  if (e.key === "Enter" && hits[searchPick]) openStudent(encodeURIComponent(hits[searchPick].user_id));
  if (e.key === "Escape") { $("search").blur(); }
});
$("search").addEventListener("focus", async () => {
  students = (await getJSON("/students")) || [];
  drawSearchResults();
});
$("search").addEventListener("blur", () => { $("search-results").hidden = true; });

// ------------------------------------------------------- clip player ----
// Asks the server for the stream around a scan (/clip/stream), waits if
// the scan was only seconds ago, then plays it on a loop.

let hls = null;          // the hls.js player, while a clip is open
let clipTimer = null;    // countdown while waiting for footage to exist
let clipNumber = 0;      // bumped on every open/close, so a slow answer for an
                         // already-closed clip is ignored

// The bottom-left text: only used while loading, counting down, or on an error.
function clipStatus(text) { $("player-status").textContent = text; }

async function openClip(cameraId, at, title) {
  closeClip();
  const mine = clipNumber;
  $("player").hidden = false;
  $("player-title").textContent = title;
  $("player-command").href = `/clip?camera_id=${encodeURIComponent(cameraId)}&at=${at}`;
  clipStatus("Loading clip…");

  const r = await fetch(`/clip/stream?camera_id=${encodeURIComponent(cameraId)}&at=${at}`);
  const body = await r.json();
  if (mine !== clipNumber) return;              // closed (or another clip opened) meanwhile
  if (!r.ok) { clipStatus(`Couldn't load clip: ${body.error}`); return; }

  // Clicked right after the scan: the end of the clip hasn't been recorded yet.
  let wait = body.ready_in;
  if (wait > 0) {
    clipStatus(`Clip ready in ${wait} s…`);
    clipTimer = setInterval(() => {
      wait -= 1;
      if (wait > 0) { clipStatus(`Clip ready in ${wait} s…`); return; }
      clearInterval(clipTimer);
      playStream(body.url);
    }, 1000);
  } else {
    playStream(body.url);
  }
}

function playStream(url) {
  // Opening the same clip twice gives the same URL; a throwaway "_" parameter
  // stops the browser reusing an old copy of the playlist (and its old token).
  url += `&_=${Date.now()}`;
  const video = $("player-video");
  clipStatus("");
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        clipStatus(`Playback failed (${data.details}). Try Open in Command.`);
        console.log("hls error", data);
      }
    });
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;   // Safari plays HLS natively
  }
  video.play().catch(() => {});   // muted, so autoplay is allowed
}

function closeClip() {
  clipNumber += 1;
  clearInterval(clipTimer);
  if (hls) { hls.destroy(); hls = null; }
  // Swap in a brand-new <video> element, so nothing from the last clip
  // (buffered video, player state) carries over to the next one.
  const old = $("player-video");
  old.pause();
  old.replaceWith(old.cloneNode(false));
  clipStatus("");
  $("player").hidden = true;
}

// Clip clicks: one handler for every clip link on every page. Runs in the
// capture phase so the click doesn't also open the row underneath.
document.addEventListener("click", e => {
  const link = e.target.closest("a[data-camera]");
  if (!link) return;
  e.preventDefault();
  e.stopPropagation();
  openClip(link.dataset.camera, Number(link.dataset.at), link.dataset.title);
}, true);

document.addEventListener("keydown", e => { if (e.key === "Escape") closeClip(); });

// ---------------------------------------------------- roster refresh ----

async function refreshRoster() {
  $("roster-status").innerHTML = `Refreshing roster<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>`;
  const r = await fetch("/roster/refresh", { method: "POST" });
  const body = await r.json();
  $("roster-status").textContent = !r.ok ? `Failed: ${body.error}`
    : body.photo_error ? `Loaded ${body.buses} doors from Command · photos failed: ${body.photo_error}`
    : `Loaded ${body.buses} doors and ${body.photos} photos from Command`;
  await loadPhotos();
  refresh();
}

// ------------------------------------------------------ refresh loop ----
// The page is picked from the part of the URL after "#":
//   ""  buses overview  ·  "bus/<door_id>"  ·  "students"  ·  "student/<user_id>"

async function refresh() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const onBuses = hash === "" || hash.startsWith("bus/");
  for (const id of ["tab-buses", "rail-buses"]) $(id).className = onBuses ? "active" : "";
  for (const id of ["tab-students", "rail-students"]) $(id).className = onBuses ? "" : "active";

  if (hash.startsWith("bus/")) return showBus(hash.slice(4));
  if (hash.startsWith("student/")) return showStudent(hash.slice(8));
  if (hash === "students") {
    students = (await getJSON("/students")) || [];
    return showStudents();
  }
  return showOverview();
}

window.onhashchange = () => { window.scrollTo(0, 0); droppedOpen = false; refresh(); };
loadPhotos().then(refresh);
// Skip a redraw while the mouse is on a bar or an issue preview, so the
// hover label doesn't blink away every 2 s.
setInterval(() => {
  if (!document.querySelector(".bar:hover, .attn-wrap:hover, .has-preview:hover")) refresh();
}, 2000);
</script>
